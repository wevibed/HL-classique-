name: Extract Project ZIP

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract ZIP
        run: |
          ZIP_FILE=$(find . -maxdepth 1 -type f -name "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "No ZIP file found."
            exit 1
          fi

          echo "Found: $ZIP_FILE"

          mkdir extracted
          unzip -q "$ZIP_FILE" -d extracted

          # If the ZIP contains one top-level folder,
          # move its contents into the repository root.
          ITEMS=$(find extracted -mindepth 1 -maxdepth 1 | wc -l)

          if [ "$ITEMS" -eq 1 ] && [ -d "$(find extracted -mindepth 1 -maxdepth 1)" ]; then
            ROOT_DIR=$(find extracted -mindepth 1 -maxdepth 1 -type d)
            cp -a "$ROOT_DIR"/. .
          else
            cp -a extracted/. .
          fi

          rm -rf extracted "$ZIP_FILE"

      - name: Commit extracted project
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A
          git commit -m "Extract project files from ZIP" || echo "Nothing to commit"
          git push
